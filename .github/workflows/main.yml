name: Build TIPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            make \
            git \
            curl \
            unzip \
            wget \
            fakeroot \
            dpkg-dev \
            xz-utils \
            libplist-dev \
            libxml2-dev \
            libssl-dev \
            libbz2-dev \
            libreadline-dev \
            zlib1g-dev
          # Cài ldid (không có sẵn trong Ubuntu repo)
          wget -O ldid https://github.com/theos/ldid/raw/master/ldid
          chmod +x ldid
          sudo mv ldid /usr/local/bin/

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: ${{ runner.os }}-theos-v1

      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          rm -rf "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Cache iOS SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/sdks
          key: ${{ runner.os }}-ios-sdk-v1

      - name: Install iOS SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          find /tmp/theos-sdks -maxdepth 1 -type f -name "*.sdk.tar.xz" -exec tar -xf {} -C "$THEOS/sdks" \;
          rm -rf /tmp/theos-sdks
          if ! find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" | grep -q .; then
            echo "ERROR: No iOS SDK was installed."
            exit 1
          fi

      - name: Verify Theos and SDK
        run: |
          echo "THEOS=$THEOS"
          echo "SDK directory:"
          ls -lah "$THEOS/sdks"
          echo "SDKs:"
          find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" -print

      - name: Fix Makefile (optional)
        run: |
          if grep -q '^export = THEOS' makefile; then
            sed -i 's/^export = THEOS \/home\/codespace\/theos/export THEOS=\/home\/codespace\/theos/' makefile
            echo "Fixed export line in Makefile"
          fi

      - name: Clean
        run: |
          set -o pipefail
          make clean || true

      - name: Build TIPA
        run: |
          set -euxo pipefail
          make package FINALPACKAGE=1

      - name: Find and upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: TIPA
          path: |
            **/*.tipa
            **/*.ipa
          if-no-files-found: error
