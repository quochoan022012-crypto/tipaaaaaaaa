name: Build TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TIPA
    runs-on: ubuntu-24.04

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ==========================================
      # 2. INSTALL BASIC DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            fakeroot \
            rsync \
            curl \
            perl \
            git \
            zip \
            unzip \
            xz-utils \
            libxml2 \
            libio-compress-lzma-perl \
            ca-certificates

          echo "Dependencies installed successfully."

      # ==========================================
      # 3. INSTALL THEOS
      # ==========================================
      - name: Install Theos
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          echo "Theos installed:"
          ls -la "$THEOS"

      # ==========================================
      # 4. INSTALL THEOS SDK
      # ==========================================
      - name: Install iOS SDK
        shell: bash
        run: |
          set -euxo pipefail

          cd "$THEOS"

          ./bin/install-sdk latest

          echo "Installed SDKs:"
          ls -lah "$THEOS/sdks"

      # ==========================================
      # 5. VERIFY TOOLCHAIN
      # ==========================================
      - name: Verify Theos
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================"
          echo "THEOS"
          echo "================================"

          echo "$THEOS"

          test -d "$THEOS"
          test -f "$THEOS/makefiles/common.mk"

          echo "================================"
          echo "SDK"
          echo "================================"

          find "$THEOS/sdks" -maxdepth 1 -type d -print

          echo "================================"
          echo "TOOLCHAIN"
          echo "================================"

          find "$THEOS/toolchain" -maxdepth 2 -type f \
            \( -name "clang" -o -name "clang++" -o -name "ldid" \) \
            -print || true

      # ==========================================
      # 6. VERIFY PROJECT
      # ==========================================
      - name: Verify project
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          find . -maxdepth 3 -type f | sort

          echo "================================"
          echo "MAKEFILE"
          echo "================================"

          if [ -f Makefile ]; then
            cat Makefile
          elif [ -f makefile ]; then
            cat makefile
          else
            echo "ERROR: Không tìm thấy Makefile/makefile"
            exit 1
          fi

      # ==========================================
      # 7. BUILD
      # ==========================================
      - name: Build package
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$GITHUB_WORKSPACE/theos"

          make clean || true

          make package \
            FINALPACKAGE=1 \
            STRIP=0 \
            messages=yes

      # ==========================================
      # 8. FIND DEB
      # ==========================================
      - name: Find package
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================"
          echo "SEARCHING PACKAGE"
          echo "================================"

          find . \
            -type f \
            \( -name "*.deb" -o -name "*.tipa" -o -name "*.ipa" \) \
            -print

          DEB=$(find packages .theos \
            -type f \
            -name "*.deb" \
            2>/dev/null | head -n 1 || true)

          if [ -z "$DEB" ]; then
            echo "ERROR: Không tìm thấy file .deb"
            exit 1
          fi

          echo "DEB=$DEB" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$DEB"

      # ==========================================
      # 9. CREATE TIPA
      # ==========================================
      - name: Create TIPA
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p output

          cp "$DEB" output/

          DEB_NAME="$(basename "$DEB")"

          TIPA_NAME="${DEB_NAME%.deb}.tipa"

          cd output

          zip -9 "$TIPA_NAME" "$DEB_NAME"

          rm -f "$DEB_NAME"

          echo "================================"
          echo "TIPA CREATED"
          echo "================================"

          ls -lah

      # ==========================================
      # 10. UPLOAD TIPA
      # ==========================================
      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: TIPA
          path: output/*.tipa
          if-no-files-found: error
          retention-days: 30
