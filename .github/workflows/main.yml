name: Build TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            make \
            git \
            curl \
            unzip \
            wget \
            ldid \
            fakeroot \
            dpkg-dev \
            xz-utils

      - name: Install Theos
        run: |
          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          set -euxo pipefail

          mkdir -p "$THEOS/sdks"

          cd "$THEOS/sdks"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          find /tmp/theos-sdks -maxdepth 1 -type f \
            -name "*.sdk.tar.xz" \
            -exec tar -xf {} -C "$THEOS/sdks" \;

          find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" -print

          if ! find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" | grep -q .; then
            echo "ERROR: No iOS SDK was installed."
            exit 1
          fi

      - name: Verify Theos SDK
        run: |
          set -euxo pipefail

          echo "THEOS=$THEOS"
          echo "SDK directory:"
          ls -lah "$THEOS/sdks"

          echo "SDKs:"
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" \
            -print

      - name: Clean
        run: |
          set -o pipefail

          make clean || true

      - name: Build TIPA
        run: |
          set -euxo pipefail

          make package FINALPACKAGE=1

      - name: Find TIPA
        run: |
          set -euxo pipefail

          echo "Searching for TIPA..."

          find . \
            -type f \
            \( -name "*.tipa" -o -name "*.ipa" \) \
            -print

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: TIPA
          path: |
            **/*.tipa
            **/*.ipa
          if-no-files-found: error
