      - name: Build package
        shell: bash
        run: |
          set -o pipefail

          export THEOS="$GITHUB_WORKSPACE/theos"

          echo "========================================"
          echo "CLEAN"
          echo "========================================"

          make clean || true

          echo "========================================"
          echo "BUILD"
          echo "========================================"

          make package \
            FINALPACKAGE=1 \
            STRIP=0 \
            messages=yes \
            2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo "========================================"
          echo "BUILD EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "========== COMPILER ERRORS =========="

            grep -n -E \
              "error:|fatal error:|undefined|No such file|not found|undeclared|unknown type|use of undeclared" \
              build.log \
              || true

            echo ""
            echo "========== LAST 150 LINES =========="

            tail -n 150 build.log

            exit "$BUILD_EXIT"
          fi

          echo "BUILD SUCCESS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
